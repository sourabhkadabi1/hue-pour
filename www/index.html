<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Hue Pour</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <!-- ===== HOME SCREEN ===== -->
  <div id="home-screen">
    <canvas id="home-scene-canvas" aria-hidden="true"></canvas>
    <div class="home-shell">
      <div class="home-top-hud">
        <button id="home-wallet" class="home-coin-pill" type="button" aria-label="Coin wallet">
          <span class="home-coin-badge">
            <svg class="coin-icon-svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <circle cx="12" cy="12" r="10.5" fill="#ffd54f" stroke="#d48800" stroke-width="1.8"/>
              <circle cx="12" cy="12" r="7" fill="#ffca28" stroke="#fff8e1" stroke-opacity="0.6" stroke-width="1"/>
              <path d="M12 7.2C13.9 10 15.2 11.7 15.2 13.4a3.2 3.2 0 1 1-6.4 0c0-1.7 1.3-3.4 3.2-6.2z" fill="#e65100"/>
            </svg>
            <span class="home-coin-plus">+</span>
          </span>
          <span class="wallet-num" id="home-coins-num">0</span>
        </button>

        <div class="home-top-right">
          <button id="btn-home-settings" class="home-gear-btn" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9.4 4.9c.1-.5.1-.9.1-1.4s0-.9-.1-1.4l2.1-1.6c.2-.1.2-.4.1-.6l-2-3.4c-.1-.2-.4-.3-.6-.2l-2.5 1a7.4 7.4 0 0 0-2.4-1.4l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-2.4 1.4l-2.5-1a.5.5 0 0 0-.6.2l-2 3.4c-.1.2-.1.5.1.6l2.1 1.6c-.1.5-.1.9-.1 1.4s0 .9.1 1.4L2.4 15c-.2.1-.2.4-.1.6l2 3.4c.1.2.4.3.6.2l2.5-1a7.4 7.4 0 0 0 2.4 1.4l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6a7.4 7.4 0 0 0 2.4-1.4l2.5 1c.2.1.5 0 .6-.2l2-3.4c.1-.2.1-.5-.1-.6l-2.1-1.6z" fill="#fff"/>
            </svg>
          </button>
          <button id="btn-home-remove-ads" class="home-side-badge ads-badge" type="button" aria-label="Remove Ads">
            <span class="ads-no-sign">ADS</span>
            <span class="side-pill-caption">Remove Ads</span>
          </button>
        </div>
      </div>

      <div class="home-side-left">
        <button id="btn-home-free-coins" class="home-side-badge coins-badge" type="button">
          <svg viewBox="0 0 28 28" width="32" height="32" aria-hidden="true">
            <rect x="2" y="6" width="24" height="16" rx="4" fill="#ffb300" stroke="#7c4700" stroke-width="1.6"/>
            <circle cx="14" cy="14" r="4.5" fill="#fff8e1"/>
            <polygon points="12.5,11.5 17,14 12.5,16.5" fill="#e65100"/>
          </svg>
          <span class="reward-btn-main side-pill-title">+150</span>
          <span class="side-pill-caption" id="home-ad-meta">10/10 today</span>
        </button>

        <button id="btn-daily" class="home-side-badge daily-badge" type="button" aria-label="Daily Puzzle">
          <svg viewBox="0 0 28 28" width="30" height="30" aria-hidden="true">
            <path d="M10 4h8l-1 5 4.5 9.5A4 4 0 0 1 18 24H10a4 4 0 0 1-3.5-5.5L11 9z" fill="#4fc3f7" stroke="#fff" stroke-width="1.6"/>
            <path d="M8.5 17h11l1.5 3A2.5 2.5 0 0 1 18.8 23H9.2A2.5 2.5 0 0 1 7 20z" fill="#ffd93d"/>
          </svg>
          <span class="side-pill-caption" id="home-daily-caption">Daily</span>
        </button>
      </div>

      <div class="home-center-spacer">
        <div class="home-brand-tag">
          <h1 class="home-title-mini">Hue Pour</h1>
          <div class="home-level-info" id="home-level-info">Level 1 · Sunrise Meadow</div>
          <div id="home-streak" class="streak-badge hidden">🔥 <span id="streak-num">0</span> day streak</div>
        </div>
      </div>

      <div class="home-cta-wrap">
        <button id="btn-play" class="btn-play-3d" type="button" aria-label="Play">LEVEL 1</button>
      </div>

      <nav class="home-dock" aria-label="Home Navigation">
        <button id="btn-home-shop" class="home-dock-btn" type="button">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M4 5h2l2.2 9.2h9.5l2.1-6.5H7.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="18.5" r="1.7" fill="currentColor"/>
            <circle cx="17" cy="18.5" r="1.7" fill="currentColor"/>
          </svg>
          <span>Shop</span>
        </button>
        <div class="home-dock-btn is-active" aria-current="page">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path d="M4 11l8-6.8L20 11v9a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z" fill="currentColor"/>
          </svg>
          <span>Home</span>
        </div>
        <button id="btn-home-modes" class="home-dock-btn" type="button">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M7 4h10v4a5 5 0 0 1-10 0V4zm-3 1h3v3H5a1 1 0 0 1-1-1V5zm13 0h3v2a1 1 0 0 1-1 1h-2V5zm-5 8v4m-3.5 3h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Modes</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- ===== MODES & CHALLENGE CODE OVERLAY ===== -->
  <div id="modes-overlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-card popup-card-violet">
      <div class="popup-ribbon">Modes &amp; Codes</div>
      <button id="btn-close-modes" class="popup-close-x" type="button" aria-label="Close">×</button>
      <div class="popup-panel-dark">
        <div id="progress-wrap" class="progress-wrap">
          <div class="progress-label"><span id="progress-text">0 / 10</span></div>
          <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        </div>
        <p class="modes-label">Enter Challenge Code</p>
        <div class="code-entry-row">
          <input id="code-input" type="text" placeholder="HP-XXXX" maxlength="16"
                 aria-label="Challenge code" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button id="btn-code-go" class="btn-sm" type="button" aria-label="Load challenge">Go</button>
        </div>
      </div>
      <button id="btn-modes-daily" class="btn-play-3d btn-modes-daily" type="button">📅 Daily Puzzle</button>
    </div>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="app" class="hidden">
    <!-- full-viewport animation overlay — fixed, above tubes -->
    <canvas id="anim-overlay"></canvas>

    <div class="game-column">
      <!-- HUD -->
      <header id="hud">
        <div class="hud-top-bar">
          <div class="hud-left-cluster">
            <button id="btn-back" class="hud-circle-btn" type="button" aria-label="Home">←</button>
            <div id="hud-wallet" class="wallet-pill wallet-pill-hud" aria-label="Coins">
              <svg class="coin-icon-svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <circle cx="12" cy="12" r="10" fill="#ffd54f" stroke="#f57f17" stroke-width="1.8"/>
                <circle cx="12" cy="12" r="7" fill="none" stroke="#fff8e1" stroke-opacity="0.55" stroke-width="1.2"/>
                <path d="M12 7.2C13.9 10 15.2 11.7 15.2 13.4a3.2 3.2 0 1 1-6.4 0c0-1.7 1.3-3.4 3.2-6.2z" fill="#ff8f00"/>
              </svg>
              <span class="wallet-num" id="hud-coins-num">0</span>
            </div>
            <div class="hud-stats-pill">
              <span id="hud-moves">Moves: 0</span>
              <span class="hud-sep">·</span>
              <span id="hud-par">Par: —</span>
            </div>
          </div>
          <div class="hud-right-cluster">
            <button id="btn-restart" class="hud-glossy-circle" type="button" aria-label="Restart">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M17.6 6.4A8 8 0 1 0 19.5 14h-2.3a5.8 5.8 0 1 1-1.2-5.9L13.5 10.5H20V4z" fill="currentColor"/>
              </svg>
            </button>
            <button id="btn-settings" class="hud-glossy-circle" type="button" aria-label="Settings">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9.4 4.9c.1-.5.1-.9.1-1.4s0-.9-.1-1.4l2.1-1.6c.2-.1.2-.4.1-.6l-2-3.4c-.1-.2-.4-.3-.6-.2l-2.5 1a7.4 7.4 0 0 0-2.4-1.4l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-2.4 1.4l-2.5-1a.5.5 0 0 0-.6.2l-2 3.4c-.1.2-.1.5.1.6l2.1 1.6c-.1.5-.1.9-.1 1.4s0 .9.1 1.4L2.4 15c-.2.1-.2.4-.1.6l2 3.4c.1.2.4.3.6.2l2.5-1a7.4 7.4 0 0 0 2.4 1.4l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6a7.4 7.4 0 0 0 2.4-1.4l2.5 1c.2.1.5 0 .6-.2l2-3.4c.1-.2.1-.5-.1-.6l-2.1-1.6z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- TOP TARGET & ADD-TUBE AD SHELF -->
      <section id="target-area" class="top-shelf">
        <div class="shelf-stage">
          <div id="target-tubes"></div>
          <div id="top-add-tubes" class="top-add-tubes">
            <button id="top-add-slot-0" class="top-add-slot" type="button" aria-label="Extra tube slot 1">
              <svg class="top-add-svg" viewBox="0 0 28 46" width="24" height="38" aria-hidden="true">
                <path d="M6 4h16v28a8 8 0 0 1-16 0z" fill="rgba(22,16,44,0.82)" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
                <path d="M14 14v10M9 19h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              <span class="top-add-ad-badge" id="top-add-badge-0">AD</span>
            </button>
            <button id="top-add-slot-1" class="top-add-slot" type="button" aria-label="Extra tube slot 2">
              <svg class="top-add-svg" viewBox="0 0 28 46" width="24" height="38" aria-hidden="true">
                <path d="M6 4h16v28a8 8 0 0 1-16 0z" fill="rgba(22,16,44,0.82)" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
                <path d="M14 14v10M9 19h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              <span class="top-add-ad-badge" id="top-add-badge-1">AD</span>
            </button>
          </div>
        </div>
        <div class="shelf-ledge"></div>
        <div id="hud-level" class="shelf-level-pill">LEVEL 1</div>
      </section>

      <!-- TUBE PLAY AREA -->
      <main id="tube-area"></main>

      <!-- TUTORIAL HINT -->
      <div id="tutorial-bar" class="hidden" role="status">
        <p id="tutorial-text"></p>
        <button id="btn-skip-tutorial" class="btn-sm">Skip</button>
      </div>

      <!-- BOTTOM CONTROLS BAR (Hint / Undo / Add Tube AD) -->
      <footer id="game-bottom-bar" class="game-bottom-bar">
        <button id="btn-hint" class="ctrl-pill ctrl-pill-purple" type="button" aria-label="Hint">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path d="M9 21h6m-5-3h4m-2-2a5 5 0 1 1 3.7-8.3c.7.7 1.1 1.6 1.2 2.6-.1 1-.6 1.9-1.2 2.6-.5.6-.7 1.3-.7 2.1h-4c0-.8-.2-1.5-.7-2.1A4.8 4.8 0 0 1 8 10.3 5 5 0 0 1 12 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="hint-count" class="ctrl-red-badge">1</span>
        </button>

        <button id="btn-undo" class="ctrl-pill ctrl-pill-purple" type="button" aria-label="Undo">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path d="M9 11L4 6.5 9 2v3h5.5a6.5 6.5 0 1 1 0 13H9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="undo-count" class="ctrl-red-badge">3</span>
        </button>

        <button id="btn-add-tube" class="ctrl-pill ctrl-pill-tube" type="button" aria-label="Add extra tube">
          <span id="add-tube-tooltip" class="plus-stuck-tooltip bottom-tooltip">Need room? Tap +</span>
          <svg viewBox="0 0 24 28" width="24" height="26" aria-hidden="true">
            <path d="M8 3h8M9.5 3v15.5a2.5 2.5 0 0 0 5 0V3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 10v5M9.5 12.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span id="add-tube-badge" class="ctrl-ad-slate">AD</span>
          <span id="add-tube-left" class="ctrl-left-sub">2 left</span>
        </button>
      </footer>
    </div>

    <div id="debug-tubes-overlay" class="debug-tubes-overlay hidden" aria-hidden="true"></div>
  </div>

  <!-- ===== WIN OVERLAY (Image 5 Crown Banner + Unlock Progress Meters) ===== -->
  <div id="win-overlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-card win-stage-card" style="position:relative;overflow:visible;">
      <div id="win-starfield" class="win-starfield"></div>
      <div class="win-crest" aria-hidden="true">
        <svg class="win-crest-svg" viewBox="0 0 260 112" width="244" height="106">
          <!-- Laurel leaves & herald trumpets -->
          <path d="M52 72 Q28 54 34 32 Q54 44 64 66Z" fill="#ffd54f" stroke="#8a4f00" stroke-width="2"/>
          <path d="M208 72 Q232 54 226 32 Q206 44 196 66Z" fill="#ffd54f" stroke="#8a4f00" stroke-width="2"/>
          <path d="M36 42 L84 58 L78 68 L28 56Z" fill="#ffb300" stroke="#7a4200" stroke-width="1.8"/>
          <path d="M224 42 L176 58 L182 68 L232 56Z" fill="#ffb300" stroke="#7a4200" stroke-width="1.8"/>
          <!-- Crown -->
          <path d="M84 54 L76 22 L106 38 L130 14 L154 38 L184 22 L176 54Z" fill="#ffca28" stroke="#8a4f00" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="130" cy="36" r="5" fill="#e53935" stroke="#fff8e1" stroke-width="1.2"/>
          <circle cx="100" cy="44" r="3.8" fill="#4fc3f7"/>
          <circle cx="160" cy="44" r="3.8" fill="#69f0ae"/>
          <!-- Crimson curved ribbon -->
          <path d="M18 64 Q130 44 242 64 L232 96 Q130 76 28 96Z" fill="#e53935" stroke="#ffd54f" stroke-width="3" stroke-linejoin="round"/>
        </svg>
        <h2 class="win-ribbon-text">Level Complete</h2>
      </div>

      <div id="cheer-text" class="cheer-text"></div>
      <div id="win-stars" class="stars win-stars-tight"></div>
      <div class="win-info-row">
        <p id="win-info"></p>
        <span id="win-extra-badge" class="extra-tube-badge hidden" title="Extra tube used" aria-label="Extra tube used">
          <svg class="tube-icon-svg small" viewBox="0 0 18 34" aria-hidden="true">
            <path d="M2 2 L2 25 A7 7 0 0 0 16 25 L16 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 11 L9 21 M5 16 L13 16" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
      </div>

      <!-- Two Unlock Progress Bars (Image 5) -->
      <div class="win-unlocks-wrap">
        <div id="win-unlock-tube-row" class="unlock-meter-row">
          <div class="unlock-meter-left">
            <div id="win-unlock-tube-label" class="unlock-meter-label">Unlocks at Lv. 10</div>
            <div class="unlock-meter-track">
              <div id="win-unlock-tube-fill" class="unlock-meter-fill"></div>
              <span id="win-unlock-tube-frac" class="unlock-meter-frac">1/10</span>
            </div>
          </div>
          <button id="win-unlock-tube-card" class="unlock-card-tilt" type="button" aria-label="Bottle unlock preview">
            <canvas id="win-unlock-tube-canvas" width="44" height="50"></canvas>
            <span id="win-unlock-tube-new" class="unlock-new-badge hidden">NEW!</span>
          </button>
        </div>

        <div id="win-unlock-theme-row" class="unlock-meter-row">
          <div class="unlock-meter-left">
            <div id="win-unlock-theme-label" class="unlock-meter-label">Unlocks at Lv. 20</div>
            <div class="unlock-meter-track">
              <div id="win-unlock-theme-fill" class="unlock-meter-fill"></div>
              <span id="win-unlock-theme-frac" class="unlock-meter-frac">1/20</span>
            </div>
          </div>
          <button id="win-unlock-theme-card" class="unlock-card-tilt" type="button" aria-label="Theme unlock preview">
            <canvas id="win-unlock-theme-canvas" width="44" height="50"></canvas>
            <span id="win-unlock-theme-new" class="unlock-new-badge hidden">NEW!</span>
          </button>
        </div>
      </div>

      <div id="win-coins-row" class="win-coins-row">
        <svg class="coin-icon-svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#ffd54f" stroke="#f57f17" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="7" fill="none" stroke="#fff8e1" stroke-opacity="0.55" stroke-width="1.2"/>
          <path d="M12 7.2C13.9 10 15.2 11.7 15.2 13.4a3.2 3.2 0 1 1-6.4 0c0-1.7 1.3-3.4 3.2-6.2z" fill="#ff8f00"/>
        </svg>
        <span id="win-coins-text">+10 coins</span>
      </div>
      <button id="btn-win-double-coins" class="btn-double-coins hidden" type="button">Watch ad: double coins</button>
      <div id="win-code-box" class="code-box win-code-compact"></div>
      <div class="btn-row">
        <button id="btn-share-result" class="btn-secondary-sm">📤 Share</button>
        <button id="btn-share-card"   class="btn-secondary-sm">🖼️ Card</button>
      </div>
      <button id="btn-next" class="btn-play-3d btn-win-next">LEVEL 2</button>
      <button id="btn-remove-ads-win" class="btn-link hidden">Remove Ads</button>
    </div>
  </div>

  <!-- ===== DAILY DONE OVERLAY ===== -->
  <div id="daily-done-overlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-card">
      <h2>📅 Daily Complete!</h2>
      <div id="daily-stars" class="stars"></div>
      <div class="win-info-row">
        <p id="daily-info"></p>
        <span id="daily-extra-badge" class="extra-tube-badge hidden" title="Extra tube used" aria-label="Extra tube used">
          <svg class="tube-icon-svg small" viewBox="0 0 18 34" aria-hidden="true">
            <path d="M2 2 L2 25 A7 7 0 0 0 16 25 L16 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 11 L9 21 M5 16 L13 16" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
      </div>
      <p id="daily-streak-line" class="streak-badge-inline"></p>
      <div id="daily-coins-row" class="win-coins-row hidden">
        <svg class="coin-icon-svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#ffd54f" stroke="#f57f17" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="7" fill="none" stroke="#fff8e1" stroke-opacity="0.55" stroke-width="1.2"/>
          <path d="M12 7.2C13.9 10 15.2 11.7 15.2 13.4a3.2 3.2 0 1 1-6.4 0c0-1.7 1.3-3.4 3.2-6.2z" fill="#ff8f00"/>
        </svg>
        <span id="daily-coins-text">+35 coins</span>
      </div>
      <button id="btn-daily-double-coins" class="btn-double-coins hidden" type="button">Watch ad: double coins</button>
      <p id="daily-countdown-line" class="countdown-text"></p>
      <div class="btn-row">
        <button id="btn-daily-share"      class="btn-secondary-sm">📤 Share</button>
        <button id="btn-daily-share-card" class="btn-secondary-sm">🖼️ Card</button>
      </div>
      <button id="btn-daily-home" class="btn-big">Home</button>
    </div>
  </div>

  <!-- ===== SHARE CARD OVERLAY ===== -->
  <div id="share-overlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-card share-card-box">
      <canvas id="share-canvas" width="1080" height="1920"></canvas>
      <div class="btn-row">
        <button id="btn-save-image"  class="btn-secondary-sm">💾 Save</button>
        <button id="btn-share-image" class="btn-secondary-sm">📤 Share</button>
        <button id="btn-close-share" class="btn-secondary-sm">Close</button>
      </div>
    </div>
  </div>

  <!-- ===== SHOP / COLLECTION OVERLAY (TUBE / THEME / COLOR) ===== -->
  <div id="shop-overlay" class="overlay hidden" aria-hidden="true">
    <div class="collection-shell">
      <header class="col-header">
        <button id="btn-close-shop" class="col-back-btn" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M9 14L4 9l5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
        <h2 id="shop-title" class="col-title">THEME</h2>
        <div id="shop-wallet" class="col-wallet-pill" aria-label="Shop coins">
          <svg class="coin-icon-svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="12" cy="12" r="10.5" fill="#ffd54f" stroke="#f57f17" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="7.2" fill="#ffca28" stroke="#fff8e1" stroke-opacity="0.6" stroke-width="1"/>
            <path d="M12 7.2C13.9 10 15.2 11.7 15.2 13.4a3.2 3.2 0 1 1-6.4 0c0-1.7 1.3-3.4 3.2-6.2z" fill="#e65100"/>
          </svg>
          <span class="wallet-num" id="shop-coins-num">0</span>
        </div>
      </header>

      <nav class="col-tabs" role="tablist" aria-label="Collection tabs">
        <button id="tab-tube" class="col-tab" type="button" role="tab" data-tab="tube" aria-label="Tubes">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M8 4h8M9.5 4v11.5a2.5 2.5 0 0 0 5 0V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="tab-theme" class="col-tab is-active" type="button" role="tab" data-tab="theme" aria-label="Themes">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="9" cy="9.5" r="1.4" fill="currentColor"/>
            <path d="M4.5 17l5-4.5 3.5 3 2.5-2 4 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="tab-color" class="col-tab" type="button" role="tab" data-tab="color" aria-label="Colors">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M12 3.5a8.5 8.5 0 1 0 0 17 1.9 1.9 0 0 0 1.9-1.9c0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3a1.9 1.9 0 0 1 1.9-1.9H17a3.5 3.5 0 0 0 3.5-3.5C20.5 6.8 16.7 3.5 12 3.5z" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="8" cy="10.5" r="1" fill="currentColor"/>
            <circle cx="11" cy="7.8" r="1" fill="currentColor"/>
            <circle cx="15" cy="9.2" r="1" fill="currentColor"/>
          </svg>
        </button>
      </nav>

      <div id="shop-grid" class="col-grid" role="tabpanel"></div>
      <div id="shop-palettes-list" class="hidden" aria-hidden="true"></div>

      <footer class="col-footer">
        <button id="btn-shop-free-coins" class="btn-col-reward" type="button">
          <svg class="ad-slate-icon" viewBox="0 0 24 20" width="22" height="18" aria-hidden="true">
            <rect x="1.5" y="2.5" width="21" height="15" rx="3" fill="#fff" stroke="#1f1f2e" stroke-width="1.6"/>
            <polygon points="10,7 16,10 10,13" fill="#1f1f2e"/>
          </svg>
          <svg class="coin-icon-svg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="12" cy="12" r="10.5" fill="#ffb300" stroke="#7c4700" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="7" fill="#ffd54f"/>
            <path d="M12 7.2C13.9 10 15.2 11.7 15.2 13.4a3.2 3.2 0 1 1-6.4 0c0-1.7 1.3-3.4 3.2-6.2z" fill="#e65100"/>
          </svg>
          <span class="reward-btn-main">+150</span>
          <span class="col-reward-meta" id="shop-ad-meta">10/10</span>
        </button>
      </footer>
    </div>
  </div>

  <!-- ===== SETTINGS OVERLAY (Image 7 Pop-up Style) ===== -->
  <div id="settings-overlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-card popup-card-violet settings-popup">
      <div class="popup-ribbon">Settings</div>
      <button id="btn-close-settings" class="popup-close-x" type="button" aria-label="Close settings">×</button>

      <div class="popup-panel-dark set-tiles-row">
        <label class="set-tile-item">
          <span class="set-tile-label">Sound</span>
          <input type="checkbox" id="set-sound" checked>
          <span class="set-tile-box">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zm0-7.7v2.1a7.5 7.5 0 0 1 0 11.2v2.1a9.5 9.5 0 0 0 0-15.4z" fill="currentColor"/>
            </svg>
            <span class="tile-slash" aria-hidden="true"></span>
          </span>
        </label>

        <label class="set-tile-item">
          <span class="set-tile-label">Vibrate</span>
          <input type="checkbox" id="set-haptics" checked>
          <span class="set-tile-box">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <rect x="8" y="4" width="8" height="16" rx="1.8" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M4 7l-1.5 2.5L4 12l-1.5 2.5L4 17m16-10l1.5 2.5L20 12l1.5 2.5L20 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="tile-slash" aria-hidden="true"></span>
          </span>
        </label>

        <label class="set-tile-item">
          <span class="set-tile-label">Color-Blind</span>
          <input type="checkbox" id="set-colorblind">
          <span class="set-tile-box">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="3.2" fill="currentColor"/>
            </svg>
            <span class="tile-slash" aria-hidden="true"></span>
          </span>
        </label>
      </div>

      <div class="popup-panel-dark set-speed-panel">
        <div class="set-speed-label">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M15 4l5 5-8.5 8.5a3.5 3.5 0 0 1-5-5L15 4z" fill="#fff"/>
            <path d="M13 6l5 5" stroke="#5e35b1" stroke-width="1.6"/>
          </svg>
          <span>Speed</span>
        </div>
        <div class="set-speed-seg" role="group" aria-label="Pour speed">
          <button id="btn-speed-1" class="speed-opt is-active" type="button" data-speed="1">x1</button>
          <button id="btn-speed-2" class="speed-opt" type="button" data-speed="2">x2</button>
          <button id="btn-speed-3" class="speed-opt" type="button" data-speed="3">x3</button>
        </div>
      </div>

      <div class="popup-panel-dark set-extra-opts">
        <label class="setting-row setting-row-compact">
          <span>Reduce Effects</span>
          <input type="checkbox" id="set-reduce">
          <span class="toggle"></span>
        </label>
        <div class="setting-row setting-row-compact vol-row">
          <span>Volume</span>
          <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.65"
                 class="vol-slider" aria-label="Master volume">
        </div>
        <div class="set-iap-row">
          <button id="btn-remove-ads" class="btn-secondary-sm set-iap-btn" type="button">Remove Ads</button>
          <button id="btn-restore"    class="btn-link set-restore-link" type="button">Restore</button>
        </div>
      </div>

      <button id="btn-settings-home" class="btn-play-3d btn-settings-home" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M4 11l8-6.8L20 11v9a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z" fill="currentColor"/>
        </svg>
        <span>HOME</span>
      </button>
    </div>
  </div>

  <div id="combo-flash" class="combo-flash hidden" aria-hidden="true"></div>

  <!-- ===== TOAST ===== -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="progression.js"></script>
  <script src="game.js"></script>
  <script src="economy.js"></script>
  <script src="monetization.js"></script>
  <script src="coins.js"></script>
  <script src="stuckdetect.js"></script>
  <script src="ui.js"></script>
</body>
</html>
