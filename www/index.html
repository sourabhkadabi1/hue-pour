<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Hue Pour</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HOME SCREEN ===== -->
  <div id="home-screen">
    <div class="home-content">
      <h1 class="home-title">Hue<br>Pour</h1>
      <p class="home-subtitle">Mix · Pour · Solve</p>

      <div class="home-level-info" id="home-level-info">Level 1</div>

      <button id="btn-play" class="btn-big" aria-label="Play">▶ Play</button>

      <button id="btn-daily" class="btn-daily" aria-label="Daily Puzzle">
        📅 Daily Puzzle
      </button>
      <div id="home-streak" class="streak-badge hidden">🔥 <span id="streak-num">0</span> day streak</div>

      <div class="code-entry-row">
        <input id="code-input" type="text" placeholder="HP-XXXX" maxlength="16"
               aria-label="Challenge code" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button id="btn-code-go" class="btn-sm" aria-label="Load challenge">Go</button>
      </div>

      <button id="btn-home-settings" class="btn-icon-row" aria-label="Settings">⚙ Settings</button>
    </div>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="app" class="hidden">
    <div class="game-column">

      <!-- HUD -->
      <header id="hud">
        <div class="hud-row">
          <button id="btn-back" class="hud-btn" aria-label="Home">← </button>
          <span id="hud-level">Level 1</span>
          <span id="hud-moves">Moves: 0</span>
          <span id="hud-par">Par: —</span>
        </div>
        <div class="hud-row hud-buttons">
          <button id="btn-undo" class="hud-btn" aria-label="Undo">↩ Undo <span id="undo-count">(3)</span></button>
          <button id="btn-hint" class="hud-btn" aria-label="Hint">💡 Hint</button>
          <button id="btn-restart" class="hud-btn" aria-label="Restart">⟳</button>
          <button id="btn-settings" class="hud-btn" aria-label="Settings">⚙</button>
        </div>
      </header>

      <!-- TARGET PALETTE -->
      <section id="target-area">
        <span class="target-label">Make:</span>
        <div id="target-tubes"></div>
      </section>

      <!-- TUBE AREA -->
      <main id="tube-area"></main>

      <!-- TUTORIAL HINT (floating at the bottom) -->
      <div id="tutorial-bar" class="hidden" role="status">
        <p id="tutorial-text"></p>
        <button id="btn-skip-tutorial" class="btn-sm">Skip</button>
      </div>

    </div><!-- .game-column -->

    <!-- Animation overlay canvas (full viewport, above tubes) -->
    <canvas id="anim-overlay"></canvas>
  </div>

  <!-- ===== WIN OVERLAY ===== -->
  <div id="win-overlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-card">
      <h2>🎉 Level Complete!</h2>
      <div id="win-stars" class="stars"></div>
      <p id="win-info"></p>
      <div id="win-code-box" class="code-box"></div>
      <div class="btn-row">
        <button id="btn-share-result" class="btn-secondary-sm">📤 Share</button>
        <button id="btn-share-card" class="btn-secondary-sm">🖼️ Card</button>
      </div>
      <button id="btn-next" class="btn-big">Next Level ▶</button>
      <button id="btn-remove-ads-win" class="btn-link hidden">Remove Ads</button>
    </div>
  </div>

  <!-- ===== DAILY DONE OVERLAY ===== -->
  <div id="daily-done-overlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-card">
      <h2>📅 Daily Complete!</h2>
      <div id="daily-stars" class="stars"></div>
      <p id="daily-info"></p>
      <p id="daily-streak-line" class="streak-badge-inline"></p>
      <p id="daily-countdown-line" class="countdown-text"></p>
      <div class="btn-row">
        <button id="btn-daily-share" class="btn-secondary-sm">📤 Share</button>
        <button id="btn-daily-share-card" class="btn-secondary-sm">🖼️ Card</button>
      </div>
      <button id="btn-daily-home" class="btn-big">Home</button>
    </div>
  </div>

  <!-- ===== SHARE CARD OVERLAY ===== -->
  <div id="share-overlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-card share-card-box">
      <canvas id="share-canvas" width="1080" height="1920"></canvas>
      <div class="btn-row">
        <button id="btn-save-image" class="btn-secondary-sm">💾 Save</button>
        <button id="btn-share-image" class="btn-secondary-sm">📤 Share</button>
        <button id="btn-close-share" class="btn-secondary-sm">Close</button>
      </div>
    </div>
  </div>

  <!-- ===== SETTINGS OVERLAY ===== -->
  <div id="settings-overlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-card">
      <h2>Settings</h2>
      <label class="setting-row">
        <span>Sound</span>
        <input type="checkbox" id="set-sound" checked>
        <span class="toggle"></span>
      </label>
      <label class="setting-row">
        <span>Haptics</span>
        <input type="checkbox" id="set-haptics" checked>
        <span class="toggle"></span>
      </label>
      <label class="setting-row">
        <span>Colorblind Mode</span>
        <input type="checkbox" id="set-colorblind">
        <span class="toggle"></span>
      </label>
      <label class="setting-row">
        <span>Reduce Effects</span>
        <input type="checkbox" id="set-reduce">
        <span class="toggle"></span>
      </label>
      <div class="settings-divider"></div>
      <button id="btn-remove-ads" class="btn-secondary-sm full-w">Remove Ads — $1.99</button>
      <button id="btn-restore" class="btn-link">Restore Purchases</button>
      <button id="btn-close-settings" class="btn-secondary-sm full-w">Close</button>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Scripts: game logic → monetization → UI -->
  <script src="game.js"></script>
  <script src="monetization.js"></script>
  <script src="ui.js"></script>
</body>
</html>
